[package]
name = "media-browser"
version = "0.1.0"
description = "A lightweight Windows YouTube music browser"
edition = "2021"
rust-version = "1.97"

[lib]
name = "media_browser_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
memory-benchmark = ["windows/Media_Control"]

[dependencies]
tauri = { version = "~2.12.3", features = ["unstable", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "time", "net", "process", "io-util", "macros"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
cpal = "0.16"
rtrb = "0.3"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "aac", "isomp4"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Media", "Foundation", "Win32_System_WinRT", "Win32_System_JobObjects", "Win32_Security", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Graphics_Gdi"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
